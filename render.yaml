services:
  - type: web
    name: deku-media-bot
    env: python
    plan: free
    buildCommand: curl -fsSL https://deno.land/install.sh | sh -s -- -y && export DENO_INSTALL="$HOME/.deno" && export PATH="$DENO_INSTALL/bin:$PATH" && pip install -r requirements.txt
    startCommand: export PATH="$HOME/.deno/bin:$PATH" && python -u bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ATELIER_API_KEY
        sync: false
      - key: ATELIER_CALLBACK_URL
        sync: false
      - key: ATELIER_RETURN_URL
        sync: false
      - key: PREMIUM_PRICE_XOF
        value: "2000"
      - key: WEBAPP_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PYTHONUNBUFFERED
        value: "1"
